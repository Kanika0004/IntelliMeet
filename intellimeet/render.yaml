# Render Blueprint: one free web service running the IntelliMeet hosted demo.
services:
  - type: web
    name: intellimeet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false   # Render asks for the value when the Blueprint is created
